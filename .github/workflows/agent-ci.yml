name: Patabin Agent CI

on:
  push:
    paths:
      - 'apps/patabin-ai/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    paths:
      - 'apps/patabin-ai/**'
      - '.github/workflows/agent-ci.yml'

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patabin-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/patabin-ai/go.mod
          cache-dependency-path: apps/patabin-ai/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: apps/patabin-ai
          args: --timeout=5m

      - name: Test with race detector
        run: go test -race -cover ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build
        run: go build ./...

      - name: Build Docker image
        working-directory: .
        run: docker build --tag patabin-ai:ci apps/patabin-ai
