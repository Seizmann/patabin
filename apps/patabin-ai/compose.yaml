services:
  patabin-ai:
    build: .
    container_name: patabin-ai
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/patabin-ai", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
